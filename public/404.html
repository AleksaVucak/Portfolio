<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 Not Found</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: black;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;           /* bring canvas into the page */
      pointer-events: none;
    }
    .content {
      position: relative;   /* create new stacking context */
      z-index: 1;           /* text sits on top of canvas */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%; height: 100%;
      color: white;
      font-family: 'Poppins', sans-serif;
    }
    .content h1 {
      font-size: 8rem;
      color: #6366f1;
      margin: 0;
    }
    .content p {
      font-size: 2rem;
      margin-top: 20px;
    }
    .content a {
      color: #6366f1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <canvas id="shooting-stars"></canvas>
  <div class="content">
    <h1>404</h1>
  </div>

  <script>
    const canvas = document.getElementById('shooting-stars');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = [];
    function createStar() {
      const fromLeft = Math.random() < 0.5;
      return {
        x: fromLeft ? 0 : Math.random() * width,
        y: fromLeft ? Math.random() * height : 0,
        length: Math.random() * 80 + 50,
        speed: Math.random() * 6 + 4,
        angle: Math.PI / 4,
        alpha: Math.random() * 0.5 + 0.5,
      };
    }
    for (let i = 0; i < 50; i++) stars.push(createStar());

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'white';
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 3;
      for (let s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(
          s.x - s.length * Math.cos(s.angle),
          s.y - s.length * Math.sin(s.angle)
        );
        ctx.stroke();
        s.x += s.speed;
        s.y += s.speed;
        if (s.x > width || s.y > height) Object.assign(s, createStar());
      }
      ctx.restore();
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
