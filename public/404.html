<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>404 Not Found</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: black;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%; height: 100%;
      color: white;
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
    }
    .content h1 {
      font-size: 8rem;
      color: #6366f1;
      margin: 0;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .content p {
      font-size: 1.25rem;
      margin-top: 1rem;
      color: #c7d2fe;
    }
    .content a {
      color: #818cf8;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .content a:hover {
      border-bottom-color: #818cf8;
    }
  </style>
</head>
<body>
  <canvas id="shooting-stars"></canvas>

  <div class="content">
    <h1>404</h1>
    <p>Looks like you took a wrong turn. <a href="/">Go home</a>.</p>
  </div>

  <script>
    // === Config (mirrors your React component defaults) ===
    const starCount = 140;                 // total twinkling stars
    const starBaseSize = 1.1;              // base radius in px (scaled by DPR)
    const starSpeed = 0.12;                // slow drift speed
    const cometChance = 0.015;             // spawn probability per frame
    const cometMinSpeed = 8;               // px/frame @ DPR=1
    const cometMaxSpeed = 16;
    const tint = ['#ffffff', '#a5b4fc'];   // star/comet gradient colors

    // === Canvas & DPR setup ===
    const canvas = document.getElementById('shooting-stars');
    const ctx = canvas.getContext('2d', { alpha: true });
    let dpr = 1;

    function resize() {
      dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels, stay crisp
    }
    resize();
    window.addEventListener('resize', () => {
      resize();
      // Re-seed stars to fill new area without stretching old positions
      seedStars();
    });

    // === Motion preference ===
    const prefersReducedMotion = window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // === Parallax state ===
    const parallax = { x: 0, y: 0, tx: 0, ty: 0 };
    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx; // [-1, 1]
      const dy = (e.clientY - cy) / cy; // [-1, 1]
      parallax.tx = dx * 8;
      parallax.ty = dy * 8;
    });

    // === Stars & Comets ===
    const stars = [];
    const comets = [];

    function makeStar(w, h) {
      const angle = Math.random() * Math.PI * 2;
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: starBaseSize + Math.random() * 1.2,
        vx: Math.cos(angle) * starSpeed,
        vy: Math.sin(angle) * starSpeed,
        tw: Math.random() * Math.PI * 2,
        ta: 0.6 + Math.random() * 0.4, // twinkle amplitude
      };
    }

    function makeComet(w, h) {
      // spawn along top/left edges, travel down-right at ~45° ±
      const fromLeft = Math.random() < 0.6;
      const startX = fromLeft ? -40 : Math.random() * w;
      const startY = fromLeft ? Math.random() * (h * 0.4) : -40;
      const speed = cometMinSpeed + Math.random() * (cometMaxSpeed - cometMinSpeed);
      const angle = (Math.PI / 4) + (Math.random() * 0.35 - 0.175); // ~45° ±10°
      const len = 120 + Math.random() * 220;
      return {
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        len,
        life: 1,
      };
    }

    function seedStars() {
      stars.length = 0;
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (let i = 0; i < starCount; i++) stars.push(makeStar(w, h));
    }
    seedStars();

    // === Helpers ===
    function hexToRgba(hex, alpha = 1) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(ch => ch + ch).join('');
      const num = parseInt(c, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // === Render loop ===
    function loop() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Smooth parallax toward target
      parallax.x += (parallax.tx - parallax.x) * 0.06;
      parallax.y += (parallax.ty - parallax.y) * 0.06;

      // Subtle persistence clears for "modern glow"
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.fillRect(0, 0, w, h);
      ctx.translate(parallax.x, parallax.y);

      // Stars: twinkle + glow + drift + wrap
      for (const s of stars) {
        s.tw += 0.02;
        const alpha = 0.5 + Math.sin(s.tw) * s.ta * 0.5;

        // soft glow
        const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3.2);
        grd.addColorStop(0, hexToRgba(tint[0], 0.9 * alpha));
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2);
        ctx.fill();

        // core
        ctx.fillStyle = hexToRgba(tint[0], 0.85 + 0.15 * alpha);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        // drift
        s.x += s.vx;
        s.y += s.vy;

        // wrap edges
        if (s.x < -10) s.x = w + 10;
        if (s.x > w + 10) s.x = -10;
        if (s.y < -10) s.y = h + 10;
        if (s.y > h + 10) s.y = -10;
      }

      // Maybe spawn a comet
      if (Math.random() < cometChance) {
        comets.push(makeComet(w, h));
      }

      // Comets: gradient trail + bright head + fade
      for (let i = comets.length - 1; i >= 0; i--) {
        const c = comets[i];
        const angle = Math.atan2(c.vy, c.vx);
        const tx = c.x - Math.cos(angle) * c.len;
        const ty = c.y - Math.sin(angle) * c.len;

        const trail = ctx.createLinearGradient(c.x, c.y, tx, ty);
        trail.addColorStop(0, hexToRgba(tint[1], 0.95 * c.life));
        trail.addColorStop(1, hexToRgba('#000000', 0.0));

        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = trail;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();

        const head = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 10);
        head.addColorStop(0, hexToRgba('#ffffff', 0.95 * c.life));
        head.addColorStop(1, hexToRgba(tint[1], 0.0));
        ctx.fillStyle = head;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // advance & fade
        c.x += c.vx;
        c.y += c.vy;
        c.life -= 0.01;

        // remove when off-screen or faded
        if (c.life <= 0 || c.x > w + 200 || c.y > h + 200) {
          comets.splice(i, 1);
        }
      }

      ctx.restore();
      raf = requestAnimationFrame(loop);
    }

    // === Start ===
    let raf = null;
    // Prime background to solid black
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    if (!prefersReducedMotion) {
      raf = requestAnimationFrame(loop);
    } else {
      // Static render (no loop) for reduced-motion users
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (const s of stars) {
        // Simple core render (no twinkle/glow animation)
        ctx.fillStyle = hexToRgba(tint[0], 0.9);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Optional: cleanup if this page is ever embedded/swapped (not needed for a 404)
    window.addEventListener('beforeunload', () => {
      if (raf) cancelAnimationFrame(raf);
    });
  </script>
</body>
</html>
