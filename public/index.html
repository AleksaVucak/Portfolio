<!DOCTYPE html>
<!-- Root element with language attribute set to English for accessibility and SEO -->
<html lang="en">
  <!-- Document metadata container (not rendered) -->
  <head>
    <!-- Character encoding: UTF-8 to correctly render special characters like "č" -->
    <meta charset="utf-8" />
    <!-- Compatibility mode for older versions of Internet Explorer -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Responsive viewport settings for proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon reference; %PUBLIC_URL% is replaced by the bundler (e.g., CRA) at build time -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- The page title shown in the browser tab and used by search engines -->
    <title>Aleksa Vučak Portfolio</title>

    <!-- Short summary for search engines -->
    <meta name="description" content="Software Developer Portfolio showcasing work experience, projects, and skills by Aleksa Vučak." />
    <!-- Keywords to hint page topic to search engines -->
    <meta name="keywords" content="Aleksa Vučak, Software Developer, Software Engineer, React, Full Stack Developer, Portfolio, Java, Python, 3D Web Design" />
    <!-- Content author identification -->
    <meta name="author" content="Aleksa Vucak" />

    <!-- Open Graph: title used when sharing on social platforms -->
    <meta property="og:title" content="Aleksa Vučak Portfolio" />
    <!-- Open Graph: description used in social previews -->
    <meta property="og:description" content="Software Developer Portfolio showcasing work experience, projects, and skills by Aleksa Vučak." />
    <!-- Open Graph: preview image path (bundler replaces %PUBLIC_URL%) -->
    <meta property="og:image" content="%PUBLIC_URL%/preview.png" />
    <!-- Open Graph: canonical URL of the page -->
    <meta property="og:url" content="https://yourdomain.com" />
    <!-- Open Graph: content type -->
    <meta property="og:type" content="website" />

  </head>

  <!-- Visible page content -->
  <body class="bg-black text-white">
    <!-- Message shown if JavaScript is disabled in the browser -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- React root mount point; your app is injected here -->
    <div id="root"></div>
  </body>
</html>
